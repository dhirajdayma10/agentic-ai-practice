name: Multi-Agent Pipeline

on: [push]

# GUARDRAIL (Domain 6): Prevent overlapping agent runs on the same branch
concurrency: 
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  research-agent-job:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run WebResearcher Agent
        run: echo "Research data collected." > research_output.txt
      - uses: actions/upload-artifact@v4
        with:
          name: shared-memory
          path: research_output.txt

  # ORCHESTRATION (Domain 5): This job waits for the research to finish
  security-agent-job:
    needs: research-agent-job 
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: shared-memory
      - name: Run SecurityReviewer Agent
        run: |
          echo "Auditing the following research data:"
          cat research_output.txt
          echo "Audit Passed: No vulnerabilities found."